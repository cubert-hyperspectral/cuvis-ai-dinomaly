# @package _global_
#
# Dinomaly + multi-file data (RGB false-color). Run from cuvis-ai-dinomaly repo:
#   uv run python examples/train_dinomaly_rgb_multifile.py
#   uv run python examples/train_dinomaly_rgb_multifile.py \n#     data.universe_csv=<lentils>/universe.csv data.splits_json=<lentils>/splits/dinomaly.json
#
defaults:
  - /training@training: default
  - _self_

name: dinomaly_multifile_rgb

output_dir: ./outputs/${name}

# Match CIR "best-checkpoint" behavior explicitly for reproducibility.
# run_dinomaly_multifile_training defaults to best already, this makes intent explicit.
eval_mode: best

minmax_init_frames: 20

data:
  # The lentils cu3s recordings, read directly by cuvis-ai-dataloader's cu3s_multi (needs the
  # Cuvis SDK). The HF dataset (PublicDatasets "industrial_fod_lentils") ships both files:
  # universe.csv lists every frame, splits/dinomaly.json assigns train / val / test.
  data_module: cu3s_multi
  universe_csv: /path/to/XMR_Industrial_Foreign_Object_Detection_Lentils/universe.csv
  splits_json: /path/to/XMR_Industrial_Foreign_Object_Detection_Lentils/splits/dinomaly.json
  batch_size: 1
  processing_mode: Reflectance
  # The SDK reads in the training process; DataLoader workers cannot use it on the GPU.
  num_workers: 0
  # Reader options, passed to MultiCu3sDataModule as they are. Every open recording holds about
  # 0.3 to 0.6 GB of GPU memory, and the train and the val loader each keep their own set. These
  # values fit an 8 GB GPU (a laptop); on a 24 GB GPU 6 open recordings make an epoch about twice
  # as fast (examples/LENTILS_TRAINING.md, section 4b). sdk_cuda: false processes the cubes on the
  # CPU instead (no extra GPU memory, slower).
  reader:
    max_open_sessions: 3
    read_ahead: 1
    cuda_cubes: false
    sdk_cuda: true

dinomaly:
  use_center_crop: false
  encoder_name: dinov2reg_vit_base_14
  bottleneck_dropout: 0.2
  decoder_depth: 8
  image_size: 448
  crop_size: 448

training:
  seed: 42
  max_epochs: 50
  accelerator: auto
  devices: 1
  default_root_dir: ${output_dir}
  precision: 32-true
  accumulate_grad_batches: 1
  enable_progress_bar: true
  enable_checkpointing: true
  log_every_n_steps: 10
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  gradient_clip_val: 0.1
  deterministic: false
  benchmark: false
  optimizer:
    name: adamw
    lr: 0.002
    weight_decay: 0.0001
    betas: [0.9, 0.999]
  scheduler:
    name: reduce_on_plateau
    monitor: metrics_anomaly/iou
    mode: max
    factor: 0.5
    patience: 2
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-06
    eps: 1.0e-08
    verbose: false

unfreeze_nodes:
  - dinomaly_detector

metric_nodes:
  - metrics_anomaly

loss_nodes:
  - dinomaly_train_loss

freeze_nodes: []
